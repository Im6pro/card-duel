<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#125b3e"><title>تحدي الكوتشينة</title><style>*{box-sizing:border-box}body{margin:0;background:#125b3e;color:white;font:16px system-ui,-apple-system,sans-serif}main{max-width:480px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 10px calc(env(safe-area-inset-bottom) + 24px)}h2{text-align:center;margin:14px 0}button,input{font:inherit;border:0;border-radius:10px;padding:12px}button{background:#f4d27d;color:#182f25;font-weight:700;cursor:pointer}input{width:100%;margin:8px 0;background:white;color:#111}#lobby{padding:24px 12px}#game{display:none}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}.bar #status{background:#f4d27d;color:#173b2b;border-radius:10px;padding:7px 10px;font-size:14px}.hint{font-size:12px;color:#d5eee0}.board{position:relative;background:#176e4b;border:2px solid #ffffff30;border-radius:18px;padding:10px 6px}.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:9px 0}.eight{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px} .card{height:71px;touch-action:none;-webkit-user-select:none;background:#fff;border-radius:8px;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 4px #0003;border:3px solid transparent;user-select:none;touch-action:manipulation}.card.red{color:#d12736}.card.empty{background:#ffffff16;color:#e6f7e9;border:2px dashed #ffffff55}.card.selected{border:3px solid #ffd04a}.stack{position:relative;min-height:80px;touch-action:none;overflow:visible}.stack .card{position:absolute;left:0;right:0;width:100%;height:71px;box-shadow:0 1px 3px #0005}.stack .card:not(:last-child){pointer-events:none}.stack .card{justify-content:flex-start;align-items:flex-start;padding:3px 6px}.stack .card b{font-size:19px;line-height:21px}.stack .card span{font-size:18px;line-height:19px}.stack .card:last-child{justify-content:flex-start;align-items:flex-start}.dragging{position:fixed!important;z-index:9999!important;pointer-events:none!important;width:72px!important;opacity:.94;transform:rotate(-4deg) scale(1.08);box-shadow:0 10px 30px #0007!important}body.drag-active{touch-action:none;user-select:none}.card b{font-size:23px}.card span{font-size:21px}.section{text-align:center;font-weight:700;margin:12px 0 4px}.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.pile{text-align:center}.pile .card{max-width:110px;margin:5px auto}.pile small{font-size:12px}.card.back{background:repeating-linear-gradient(45deg,#1d426e 0px,#1d426e 7px,#2c6192 7px,#2c6192 14px);border:4px solid #f4f0df;color:white;box-shadow:inset 0 0 0 2px #fff9,0 2px 5px #0005}.card.back:after{content:'♠ ♥';font-size:17px;background:#fff2;padding:7px;border-radius:7px}.card.back b{display:none}.card.back span{display:none}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}#msg{min-height:25px;text-align:center;color:#ffe5a2;font-size:14px}#room{font-size:14px}#status{font-weight:bold}#win{text-align:center;font-size:22px}@media(orientation:landscape){main{max-width:100%;padding:5px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left))}h2{font-size:17px;margin:2px}.bar{margin:3px 0}.board{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px;align-items:start;padding:7px}.board .section{font-size:12px;margin:3px 0}.board #lefttable{grid-column:1;grid-row:2}.board #found{grid-column:2;grid-row:2}.board #righttable{grid-column:3;grid-row:2}.board .section:nth-of-type(1){grid-column:1;grid-row:1}.board .section:nth-child(3){grid-column:2;grid-row:1}.board .section:nth-child(5){grid-column:3;grid-row:1}.four,.eight{margin:0;gap:3px}.card{height:52px;border-radius:6px}.stack .card{height:52px}.stack{min-height:55px}.stack .card b,.card b{font-size:17px}.stack .card span,.card span{font-size:17px}.hand{max-width:650px;margin:5px auto;gap:5px}.pile .card{height:51px;max-width:95px}.controls button{padding:7px 10px;font-size:13px}.hint{font-size:10px;text-align:center}#msg{min-height:16px;font-size:12px}}@media(orientation:portrait){#game:before{content:'↻ لف الآيفون بالعرض لتجربة الطاولة الأوسع';display:block;text-align:center;background:#f4d27d;color:#183c2c;padding:7px;border-radius:8px;margin-bottom:8px;font-size:13px}}  .board>.section,.board>.four,.board>.eight{position:relative;z-index:1}  .turn-indicator{display:inline-block;padding:5px 10px;border-radius:18px;background:#ffffff22;font-size:13px;font-weight:700}.turn-indicator.mine{background:#f4d27d;color:#173b2b;animation:turnpulse 1.4s infinite}@keyframes turnpulse{50%{box-shadow:0 0 0 5px #f4d27d22}}  .card{transition:transform .15s ease,box-shadow .15s ease}.card:active{transform:translateY(-3px)}.turn-bottom{margin:4px auto;text-align:center;font-size:13px;font-weight:700;color:#ffe4a0}.last-card{animation:shine 1.2s ease-in-out infinite}@keyframes shine{0%,100%{box-shadow:none;color:#fff}50%{box-shadow:0 0 15px #ffdc55;color:#ffe17d}}.card-enter{animation:cardenter .22s ease-out}@keyframes cardenter{from{transform:translateY(-14px) rotate(-4deg);opacity:.4}to{transform:translateY(0);opacity:1}}.turn-toast{position:fixed;top:12%;left:50%;transform:translateX(-50%);background:#f4d27d;color:#183c2c;padding:10px 18px;border-radius:20px;z-index:1000;pointer-events:none;animation:toastfade 1.2s both}@keyframes toastfade{0%{opacity:0}20%,75%{opacity:1}100%{opacity:0}} </style></head><body><main><h2>🃏 تحدي الكوتشينة</h2><div id="lobby"><p>العب مع رفيجك من تلفونين</p><input id="name" placeholder="اسمك" maxlength="24"><input id="code" placeholder="كود الغرفة (للانضمام)" maxlength="6"><div class="controls"><button onclick="join(false)">إنشاء غرفة</button><button onclick="join(true)">دخول الغرفة</button><button onclick="testMode()">🧪 تجربة بروحي ضد Bot</button></div><p id="welcome"></p></div><div id="game"><div class="bar"><span id="room"></span><span id="status"></span><span id="turnarrow" class="turn-indicator"></span><span id="opcount" class="turn-indicator"></span><span id="scores" style="width:100%;text-align:center;font-size:13px;color:#f9e8b2"></span></div><div id="msg"></div><div id="turnbottom" class="turn-bottom"></div><div class="board"><div class="section">اليسار — 4 أماكن</div><div class="four" id="lefttable"></div><div class="section">النص — تصاعدي نفس الشكل</div><div class="eight" id="found"></div><div class="section">اليمين — 4 أماكن</div><div class="four" id="righttable"></div></div><div class="hand"><div class="pile"><small>اليمين — 13</small><div id="right"></div><small id="rc"></small></div><div class="pile"><small>النار</small><div id="fire"></div><small id="fc"></small></div><div class="pile"><small>السحبة — يسار</small><div id="draw"></div><small id="lc"></small></div><div class="pile"><small id="opfirelabel">نار الخصم</small><div id="opfire"></div><small id="opfc"></small></div></div><div class="controls"><button onclick="action('draw')">اسحب من اليسار</button><button onclick="action('discard')">قط بالنار / إنهاء الدور</button><button onclick="share()">مشاركة الغرفة</button><button onclick="newTest()">تجربة جديدة</button><button onclick="leaveRoom()">🚪 مغادرة الغرفة</button></div><p class="hint">اضغط الورقة ثم مكان التركيب. النار تنفتح بعد أول تركيب. التحريك ورقة ورقة.</p><div id="win"></div></div></main><script>let audioCtx=null,lastTurn=null,lastLog='',lastMoveSignature='';function sound(kind){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let t=audioCtx.currentTime,o=audioCtx.createOscillator(),gain=audioCtx.createGain();o.type=kind==='end'?'sine':'triangle';o.frequency.setValueAtTime(kind==='end'?650:470,t);o.frequency.exponentialRampToValueAtTime(kind==='end'?420:110,t+.08);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(kind==='end'?.075:.12,t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(gain);gain.connect(audioCtx.destination);o.start(t);o.stop(t+.15)}catch(e){}}document.addEventListener('pointerdown',()=>{try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}},{once:true});function notifyTurn(){let old=document.querySelector('.turn-toast');if(old)old.remove();let n=document.createElement('div');n.className='turn-toast';n.textContent='➜ دورك الحين';document.body.append(n);setTimeout(()=>n.remove(),1300)}let code=localStorage.getItem('cd_code'),token=localStorage.getItem('cd_token'),state=null,selected=null,sessionVersion=0;const $=id=>document.getElementById(id);const req=async(path,data)=>{let r=await fetch('/api/'+path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});let j=await r.json();if(!r.ok)throw Error(j.error);return j};function card(c,id,dest=false){let el=document.createElement('div');el.className='card '+(c&&'♥♦'.includes(c.s)?'red ':'')+(!c?'empty ':'')+(selected===id?'selected':'');el.innerHTML=c?'<b>'+c.r+'</b><span>'+c.s+'</span>':dest?'＋':'—';el.onclick=()=>choose(id,dest);return el}function fill(id,items,prefix,offset=0){$(id).replaceChildren(...items.map((pile,i)=>{let wrap=document.createElement('div');wrap.className='stack';wrap.dataset.target=prefix+(i+offset);let arr=Array.isArray(pile)?pile:[];arr.forEach((c,j)=>{let el=card(c,prefix+(i+offset),true);el.style.top=(j*30)+'px';el.style.zIndex=j+1;if(j!==arr.length-1)el.onclick=null;wrap.append(el)});if(!arr.length)wrap.append(card(null,prefix+(i+offset),true));wrap.style.minHeight=(71+Math.max(0,arr.length-1)*30)+'px';return wrap}))}function render(){if(!state)return;$('lobby').style.display='none';$('game').style.display='block';$('room').textContent='الغرفة: '+code;$('status').textContent=state.started?(state.winner!==null?'انتهت اللعبة':'الدور عند: '+(state.players[state.turn]||'لاعب')+(state.turn===state.me?' (أنت)':'')):'بانتظار رفيجك';$('msg').textContent=state.log||'';$('turnarrow').textContent=state.started?(state.turn===state.me?'➜ دورك الحين':'➜ دور الخصم'):'⏳ انتظار';$('turnarrow').classList.toggle('mine',state.started&&state.turn===state.me&&state.winner===null);$('opcount').textContent=state.opponent?'🃏 باقي للخصم: '+(state.opponent.right+state.opponent.left+state.opponent.fire+(state.opponent.drawn?1:0)):' ';$('turnbottom').textContent=state.turn===state.me?'➜ دورك — تقدر تلعب':'⏳ دور '+(state.players[state.turn]||'الخصم');$('opcount').classList.toggle('last-card',!!state.opponent&&(state.opponent.right+state.opponent.left+state.opponent.fire+(state.opponent.drawn?1:0))===1);$('scores').textContent=state.started&&state.scores?state.players.map((n,i)=>n+': '+state.scores[i]).join('  |  '):'';if(!state.started)return;fill('lefttable',state.table.slice(0,4),'t');fill('righttable',state.table.slice(4),'t',4);$('found').replaceChildren(...state.found.map((c,i)=>{let el=card(c,'f'+i,true);el.dataset.found='f'+i;return el}));$('right').replaceChildren(card(state.right,'right'));let deck=card(null,'deck');if(state.leftCount){deck.classList.remove('empty');deck.classList.add('back');deck.innerHTML='';deck.onclick=()=>action('draw')}else{deck.onclick=()=>action('draw')}let deckbox=document.createElement('div');deckbox.append(deck);if(state.drawn){let up=card(state.drawn,'drawn');up.classList.add('card-enter');up.style.marginTop='6px';deckbox.append(up)}$('draw').replaceChildren(deckbox);$('fire').replaceChildren(card(state.fire,'fire'));$('fire').dataset.target='fire';$('opfire').replaceChildren(card(state.opponent?.fireTop||null,'opfire'));$('opfirelabel').textContent='نار '+(state.opponent?.name||'الخصم');$('opfc').textContent=(state.opponent?.fire||0)+' ورقة';$('rc').textContent=state.rightCount+' ورقة';$('lc').textContent=state.leftCount+' ورقة';$('fc').textContent=state.fireCount+' ورقة';$('win').textContent=state.winner===null?'':state.winner===state.me?'🏆 فزت!':'فاز رفيجك';if(state.winner!==null&&!$('restart')){let b=document.createElement('button');b.id='restart';b.textContent='العب مرة ثانية';b.onclick=()=>action('restart');$('win').append(b)}}function clearSession(){sessionVersion++;localStorage.removeItem('cd_code');localStorage.removeItem('cd_token');code=null;token=null;state=null;selected=null;if(drag?.clone)drag.clone.remove();drag=null;document.body.classList.remove('drag-active');$('game').style.display='none';$('lobby').style.display='block';$('code').value='';history.replaceState(null,'',location.pathname)}function leaveRoom(){if(!confirm('تبي تغادر الغرفة وترجع للقائمة الرئيسية؟'))return;clearSession();$('welcome').textContent='رجعت للقائمة الرئيسية. اختر تجربة بروحك أو غرفة جديدة'}function newTest(){if(!confirm('تبي تبدأ تجربة جديدة؟'))return;clearSession();$('welcome').textContent='جاري إنشاء تجربة جديدة...';testMode()}async function testMode(){const v=++sessionVersion;try{let j=await req('test',{name:$('name').value.trim()||'لاعب'});if(v!==sessionVersion)return;code=j.code;token=j.token;localStorage.setItem('cd_code',code);localStorage.setItem('cd_token',token);selected=null;await refresh()}catch(e){alert(e.message)}}async function join(isJoin){const v=++sessionVersion;try{let name=$('name').value.trim()||'لاعب';let j=await req(isJoin?'join':'create',{name,code:$('code').value.trim()});if(v!==sessionVersion)return;code=j.code;token=j.token;localStorage.setItem('cd_code',code);localStorage.setItem('cd_token',token);$('welcome').textContent='كود الغرفة: '+code;await refresh()}catch(e){alert(e.message)}}async function refresh(){if(!code||!token)return;const v=sessionVersion,c=code,t=token;try{const next=await req('state?code='+encodeURIComponent(c)+'&token='+encodeURIComponent(t));if(v!==sessionVersion||c!==code||t!==token)return;if(state&&state.started&&next.started&&state.turn!==next.turn){sound('end');if(next.turn===next.me)notifyTurn()}if(state&&state.started&&next.log!==state.log&&next.log?.includes(' ركّب '))sound('card');state=next;render()}catch(e){if(v===sessionVersion)$('welcome').textContent=e.message}}async function action(type,from,to){if(!state||!state.started||state.turn!==state.me)return;const v=sessionVersion,c=code,t=token;try{const next=await req('action',{code:c,token:t,type,from,to});if(v!==sessionVersion)return;if(state&&state.turn!==next.turn){sound('end');if(next.turn===next.me)notifyTurn()}else if(type==='move'){sound('card');if(navigator.vibrate)navigator.vibrate(15)}state=next;selected=null;render()}catch(e){if(v===sessionVersion)$('msg').textContent=e.message}}function topCard(id){if(!state)return null;if(id==='right')return state.right;if(id==='fire')return state.fire;if(id==='drawn')return state.drawn;if(/^t[0-7]$/.test(id))return state.table[Number(id.slice(1))]?.at(-1)||null;return null}function choose(id,dest){if(!state||state.turn!==state.me||state.winner!==null)return;if(id==='deck'){action('draw');return}let picked=topCard(id);if(!selected&&picked?.n===1){let open=state.found.findIndex(x=>!x);if(open>=0){action('move',id,'f'+open);return}}if(selected==='drawn'&&id==='fire'){selected=null;action('discard');return}if(selected&&dest&&selected!==id){let s=selected;selected=null;action('move',s,id);return}if(id==='fire'&&!state.openFire){$('msg').textContent='النار تنفتح بعد أول تركيب';return}if(id[0]==='f'||!dest&&id==='drawn'&&!state.drawn)return;selected=id;render()}async function share(){let url=location.origin+'/?room='+code;try{if(navigator.share)await navigator.share({title:'تحدي الكوتشينة',text:'كود الغرفة: '+code,url});else{await navigator.clipboard.writeText(url+' كود: '+code);alert('تم نسخ الرابط')}}catch(e){}}let p=new URLSearchParams(location.search).get('room');if(p)$('code').value=p;refresh();setInterval(()=>{if(!drag&&!selected)refresh()},1800);let drag=null;document.addEventListener('pointerdown',e=>{let el=e.target.closest('.card');if(!el||!state||state.turn!==state.me||state.winner!==null)return;let wrap=el.closest('.stack');let id=wrap?.dataset.target||(['right','fire'].find(x=>el.parentElement?.id===x))||(el.parentElement?.parentElement?.id==='draw'&&el.querySelector('b')?'drawn':null);if(!id||id==='fire'&&!state.openFire||!el.querySelector('b'))return;drag={id,x:e.clientX,y:e.clientY,clone:null};},{passive:true});document.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.clone&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>9){let source=document.querySelector('.stack[data-target="'+drag.id+'"] .card:last-child')||(drag.id==='drawn'?document.querySelector('#draw .card:last-child'):document.querySelector('#'+drag.id+' .card'));if(!source)return;drag.clone=source.cloneNode(true);drag.clone.classList.add('dragging');document.body.append(drag.clone);document.body.classList.add('drag-active')}if(drag.clone){drag.clone.style.left=(e.clientX-36)+'px';drag.clone.style.top=(e.clientY-46)+'px';if(e.cancelable)e.preventDefault()}},{passive:false});document.addEventListener('pointercancel',()=>{if(drag?.clone)drag.clone.remove();drag=null;document.body.classList.remove('drag-active')});document.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;if(d.clone){d.clone.remove();document.body.classList.remove('drag-active');let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.stack,[data-found]');let to=target?.dataset.target||target?.dataset.found;if(d.id==='drawn'&&document.elementFromPoint(e.clientX,e.clientY)?.closest('#fire')){action('discard');return}if(!to){let nearest=null,dist=Infinity;document.querySelectorAll('.stack,[data-found]').forEach(el=>{let b=el.getBoundingClientRect(),dx=Math.max(b.left-e.clientX,0,e.clientX-b.right),dy=Math.max(b.top-e.clientY,0,e.clientY-b.bottom),d=Math.hypot(dx,dy);if(d<dist){dist=d;nearest=el}});if(dist<65)to=nearest?.dataset.target||nearest?.dataset.found}if(!to&&topCard(d.id)?.n===1){let open=state.found.findIndex(x=>!x);if(open>=0)to='f'+open}if(to&&to!==d.id)action('move',d.id,to);else{selected=null;render()}}},{passive:true});</script></body></html>
