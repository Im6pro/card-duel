<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#125b3e"><title>تحدي الكوتشينة</title><style>*{box-sizing:border-box}body{margin:0;background:#125b3e;color:white;font:16px system-ui,-apple-system,sans-serif}main{max-width:480px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 10px calc(env(safe-area-inset-bottom) + 24px)}h2{text-align:center;margin:14px 0}button,input{font:inherit;border:0;border-radius:10px;padding:12px}button{background:#f4d27d;color:#182f25;font-weight:700;cursor:pointer}input{width:100%;margin:8px 0;background:white;color:#111}#lobby{padding:24px 12px}#game{display:none}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}.bar #status{background:#f4d27d;color:#173b2b;border-radius:10px;padding:7px 10px;font-size:14px}.hint{font-size:12px;color:#d5eee0}.board{background:#176e4b;border:2px solid #ffffff30;border-radius:18px;padding:10px 6px}.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:9px 0}.eight{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.card{height:91px;touch-action:none;-webkit-user-select:none;background:#fff;border-radius:8px;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 4px #0003;border:3px solid transparent;user-select:none;touch-action:manipulation}.card.red{color:#d12736}.card.empty{background:#ffffff16;color:#e6f7e9;border:2px dashed #ffffff55}.card.selected{border:3px solid #ffd04a}.stack{position:relative;min-height:104px;touch-action:none;overflow:visible}.stack .card{position:absolute;left:0;right:0;width:100%;height:91px;box-shadow:0 1px 3px #0005}.stack .card:not(:last-child){pointer-events:none}.stack .card{justify-content:flex-start;align-items:flex-start;padding:5px 8px}.stack .card b{font-size:22px}.stack .card span{font-size:20px;line-height:19px}.stack .card:last-child{justify-content:center;align-items:center}.dragging{position:fixed!important;z-index:9999!important;pointer-events:none!important;width:72px!important;opacity:.94;transform:rotate(-4deg) scale(1.08);box-shadow:0 10px 30px #0007!important}body.drag-active{touch-action:none;user-select:none}.card b{font-size:25px}.card span{font-size:23px}.section{text-align:center;font-weight:700;margin:12px 0 4px}.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.pile{text-align:center}.pile .card{max-width:110px;margin:5px auto}.pile small{font-size:12px}.card.back{background:repeating-linear-gradient(45deg,#1d426e 0px,#1d426e 7px,#2c6192 7px,#2c6192 14px);border:4px solid #f4f0df;color:white;box-shadow:inset 0 0 0 2px #fff9,0 2px 5px #0005}.card.back:after{content:'♠ ♥';font-size:17px;background:#fff2;padding:7px;border-radius:7px}.card.back b{display:none}.card.back span{display:none}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}#msg{min-height:25px;text-align:center;color:#ffe5a2;font-size:14px}#room{font-size:14px}#status{font-weight:bold}#win{text-align:center;font-size:22px}</style></head><body><main><h2>🃏 تحدي الكوتشينة</h2><div id="lobby"><p>العب مع رفيجك من تلفونين</p><input id="name" placeholder="اسمك" maxlength="24"><input id="code" placeholder="كود الغرفة (للانضمام)" maxlength="6"><div class="controls"><button onclick="join(false)">إنشاء غرفة</button><button onclick="join(true)">دخول الغرفة</button></div><p id="welcome"></p></div><div id="game"><div class="bar"><span id="room"></span><span id="status"></span></div><div id="msg"></div><div class="board"><div class="section">اليسار — 4 أماكن</div><div class="four" id="lefttable"></div><div class="section">النص — تصاعدي نفس الشكل</div><div class="eight" id="found"></div><div class="section">اليمين — 4 أماكن</div><div class="four" id="righttable"></div></div><div class="hand"><div class="pile"><small>اليمين — 13</small><div id="right"></div><small id="rc"></small></div><div class="pile"><small>النار</small><div id="fire"></div><small id="fc"></small></div><div class="pile"><small>السحبة — يسار</small><div id="draw"></div><small id="lc"></small></div></div><div class="controls"><button onclick="action('draw')">اسحب من اليسار</button><button onclick="action('discard')">قط بالنار / إنهاء الدور</button><button onclick="share()">مشاركة الغرفة</button></div><p class="hint">اضغط الورقة ثم مكان التركيب. النار تنفتح بعد أول تركيب. التحريك ورقة ورقة.</p><div id="win"></div></div></main><script>let code=localStorage.getItem('cd_code'),token=localStorage.getItem('cd_token'),state=null,selected=null;const $=id=>document.getElementById(id);const req=async(path,data)=>{let r=await fetch('/api/'+path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});let j=await r.json();if(!r.ok)throw Error(j.error);return j};function card(c,id,dest=false){let el=document.createElement('div');el.className='card '+(c&&'♥♦'.includes(c.s)?'red ':'')+(!c?'empty ':'')+(selected===id?'selected':'');el.innerHTML=c?'<b>'+c.r+'</b><span>'+c.s+'</span>':dest?'＋':'—';el.onclick=()=>choose(id,dest);return el}function fill(id,items,prefix){$(id).replaceChildren(...items.map((pile,i)=>{let wrap=document.createElement('div');wrap.className='stack';wrap.dataset.target=prefix+i;let arr=Array.isArray(pile)?pile:[];arr.forEach((c,j)=>{let el=card(c,prefix+i,true);el.style.top=Math.min((arr.length-1-j)*19,95)+'px';el.style.zIndex=j+1;if(j!==arr.length-1)el.onclick=null;wrap.append(el)});if(!arr.length)wrap.append(card(null,prefix+i,true));wrap.style.minHeight=(91+Math.min(Math.max(0,arr.length-1)*19,95))+'px';return wrap}))}function render(){if(!state)return;$('lobby').style.display='none';$('game').style.display='block';$('room').textContent='الغرفة: '+code;$('status').textContent=state.started?(state.winner!==null?'انتهت اللعبة':'الدور عند: '+(state.players[state.turn]||'لاعب')+(state.turn===state.me?' (أنت)':'')):'بانتظار رفيجك';$('msg').textContent=state.log||'';if(!state.started)return;fill('lefttable',state.table.slice(0,4),'t');fill('righttable',state.table.slice(4),'t4');$('found').replaceChildren(...state.found.map((c,i)=>{let el=card(c,'f'+i,true);el.dataset.found='f'+i;return el}));$('right').replaceChildren(card(state.right,'right'));let deck=card(null,'deck');if(state.leftCount){deck.classList.remove('empty');deck.classList.add('back');deck.innerHTML='';deck.onclick=()=>action('draw')}else{deck.onclick=()=>action('draw')}let deckbox=document.createElement('div');deckbox.append(deck);if(state.drawn){let up=card(state.drawn,'drawn');up.style.marginTop='6px';deckbox.append(up)}$('draw').replaceChildren(deckbox);$('fire').replaceChildren(card(state.fire,'fire'));$('rc').textContent=state.rightCount+' ورقة';$('lc').textContent=state.leftCount+' ورقة';$('fc').textContent=state.fireCount+' ورقة';$('win').textContent=state.winner===null?'':state.winner===state.me?'🏆 فزت!':'فاز رفيجك';if(state.winner!==null&&!$('restart')){let b=document.createElement('button');b.id='restart';b.textContent='العب مرة ثانية';b.onclick=()=>action('restart');$('win').append(b)}}async function join(isJoin){try{let name=$('name').value.trim()||'لاعب';let j=await req(isJoin?'join':'create',{name,code:$('code').value.trim()});code=j.code;token=j.token;localStorage.setItem('cd_code',code);localStorage.setItem('cd_token',token);$('welcome').textContent='كود الغرفة: '+code;await refresh()}catch(e){alert(e.message)}}async function refresh(){if(!code||!token)return;try{state=await req('state?code='+encodeURIComponent(code)+'&token='+encodeURIComponent(token));render()}catch(e){$('welcome').textContent=e.message}}async function action(type,from,to){if(!state||!state.started||state.turn!==state.me)return;try{state=await req('action',{code,token,type,from,to});selected=null;render()}catch(e){$('msg').textContent=e.message}}function choose(id,dest){if(!state||state.turn!==state.me||state.winner!==null)return;if(id==='deck'){action('draw');return}if(selected&&dest&&selected!==id){let s=selected;selected=null;action('move',s,id);return}if(id[0]==='f'||!dest&&id==='drawn'&&!state.drawn)return;selected=id;render()}async function share(){let url=location.origin+'/?room='+code;try{if(navigator.share)await navigator.share({title:'تحدي الكوتشينة',text:'كود الغرفة: '+code,url});else{await navigator.clipboard.writeText(url+' كود: '+code);alert('تم نسخ الرابط')}}catch(e){}}let p=new URLSearchParams(location.search).get('room');if(p)$('code').value=p;refresh();setInterval(()=>{if(!drag&&!selected)refresh()},1200);let drag=null;document.addEventListener('pointerdown',e=>{let el=e.target.closest('.card');if(!el||!state||state.turn!==state.me||state.winner!==null)return;let wrap=el.closest('.stack');let id=wrap?.dataset.target||(['right','fire'].find(x=>el.parentElement?.id===x))||(el.parentElement?.parentElement?.id==='draw'&&el.querySelector('b')?'drawn':null);if(!id||id==='fire'&&!state.openFire||!el.querySelector('b'))return;drag={id,x:e.clientX,y:e.clientY,clone:null};},{passive:true});document.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.clone&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>9){let source=document.querySelector('.stack[data-target="'+drag.id+'"] .card:last-child')||document.querySelector('#'+drag.id+' .card')||(drag.id==='drawn'?document.querySelector('#draw .card:last-child'):null);if(!source)return;drag.clone=source.cloneNode(true);drag.clone.classList.add('dragging');document.body.append(drag.clone);document.body.classList.add('drag-active')}if(drag.clone){drag.clone.style.left=(e.clientX-36)+'px';drag.clone.style.top=(e.clientY-46)+'px'}},{passive:false});document.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;if(d.clone){d.clone.remove();document.body.classList.remove('drag-active');let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.stack,[data-found]');let to=target?.dataset.target||target?.dataset.found;if(to&&to!==d.id)action('move',d.id,to);else{selected=null;render()}}},{passive:true});</script></body></html>
