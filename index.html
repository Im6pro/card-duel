ames emberPulse{0%,100%{opacity:.22;transform:scale(.65)}42%{opacity:.95;transform:scale(1.25)}58%{opacity:.55;transform:scale(.9)}}@keyframes smokeLift{0%{opacity:0;transform:translate(0,8px) rotate(-10deg)}25%{opacity:.38}100%{opacity:0;transform:translate(-13px,-40px) rotate(18deg) scale(1.5)}}@keyframes controlEntrance{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){#lobby .king-art *,#lobby input,#lobby .controls,#lobby #welcome{animation:none}}/* Animated side suits and subtle glowing table frame */#game .board{isolation:isolate;border:2px solid #d8a95b;box-shadow:inset 0 0 18px #e9b85c24,0 0 9px #f4ce7440;animation:tableFrameGlow 5s ease-in-out infinite}#game .board-suits{position:absolute;top:4%;bottom:4%;width:23px;pointer-events:none;z-index:0;overflow:hidden;display:flex;flex-direction:column;justify-content:space-around;align-items:center}#game .board-suits-left{left:2px}#game .board-suits-right{right:2px}#game .board-suits span{font-family:Georgia,serif;font-size:clamp(14px,2.5vw,22px);color:#e5b85e;text-shadow:0 0 7px #f7ca7d88;opacity:.4;animation:boardSuitFloat 4.5s ease-in-out infinite alternate}#game .board-suits span:nth-child(2){color:#ee7881;animation-delay:-1.2s}#game .board-suits span:nth-child(3){color:#e6a758;animation-delay:-2.3s}#game .board-suits span:nth-child(4){animation-delay:-3.2s}@keyframes tableFrameGlow{0%,100%{border-color:#c49a52;box-shadow:inset 0 0 14px #e9b85c15,0 0 5px #e8b4572b}50%{border-color:#f6d78c;box-shadow:inset 0 0 22px #e9b85c28,0 0 15px #f5d18470}}@keyframes boardSuitFloat{0%{transform:translateY(6px) rotate(-12deg) scale(.9);opacity:.2}100%{transform:translateY(-8px) rotate(13deg) scale(1.12);opacity:.62}}@media(prefers-reduced-motion:reduce){#game .board,#game .board-suits span{animation:none}}</style></head><body><main><h2>♛ King Slayer ♛</h2><div id="lobby"><div class="king-art" aria-hidden="true"><div class="king-art-image"></div><div class ="pile"><small>النار</small><div id="fire"></div><small id="fc"></small></div><div class="pile"><small>السحبة — يسار</small><div id="draw"></div><small id="lc"></small></div><div class="pile"><small id="opfirelabel">نار الخصم</small><div id="opfire"></div><small id="opfc"></small></div></div><div class="controls"><button onclick="action('draw')">اسحب من اليسار</button><button onclick="action('discard')">قط بالنار / إنهاء الدور</button><button onclick="share()">مشاركة الغرفة</button><button onclick="newTest()">تجربة جديدة</button><button onclick="leaveRoom()">🚪 مغادرة الغرفة</button></div><p class="hint">اضغط الورقة ثم مكان التركيب. النار تنفتح بعد أول تركيب. التحريك ورقة ورقة.</p><div id="win"></div></div></main><script>let audioCtx=null,lastTurn=null,lastLog='',lastMoveSignature='';function sound(kind){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let t=audioCtx.currentTime,o=audioCtx.createOscillator(),gain=audioCtx.createGain();o.type=kind==='end'?'sine':'triangle';o.frequency.setValueAtTime(kind==='end'?650:470,t);o.frequency.exponentialRampToValueAtTime(kind==='end'?420:110,t+.08);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(kind==='end'?.075:.12,t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(gain);gain.connect(audioCtx.destination);o.start(t);o.stop(t+.15)}catch(e){}}document.addEventListener('pointerdown',()=>{try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}},{once:true});function notifyTurn(){let old=document.querySelector('.turn-toast');if(old)old.remove();let n=document.createElement('div');n.className='turn-toast';n.textContent='➜ دورك الحين';document.body.append(n);setTimeout(()=>n.remove(),1300)}let code=localStorage.getItem('cd_code'),token=localStorage.getItem('cd_token'),state=null,selected=null,sessionVersion=0;const $=id=>document.getElementById(id);const req=async(path,data)=>{let r=await fetch('/api/'+path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});let j=await r.json();if(!r.ok)throw Error(j.error);return j};function card(c,id,dest=false){let el=document.createElement('div');el.className='card '+(c&&'♥♦'.includes(c.s)?'red ':'')+(!c?'empty ':'')+(selected===id?'selected':'');el.innerHTML=c?'<b>'+c.r+'</b><span>'+c.s+'</span>':dest?'＋':'—';el.onclick=()=>choose(id,dest);return el}function fill(id,items,prefix,offset=0){$(id).replaceChildren(...items.map((pile,i)=>{let wrap=document.createElement('div');wrap.className='stack';wrap.dataset.target=prefix+(i+offset);let arr=Array.isArray(pile)?pile:[];arr.forEach((c,j)=>{let el=card(c,prefix+(i+offset),true);el.style.top=(j*19)+'px';el.style.zIndex=j+1;if(j!==arr.length-1)el.onclick=null;wrap.append(el)});if(!arr.length)wrap.append(card(null,prefix+(i+offset),true));wrap.style.minHeight=(46+Math.max(0,arr.length-1)*19)+'px';return wrap}))}function render(){if(!state)return;$('lobby').style.display='none';$('game').style.display='block';$('room').textContent='الغرفة: '+code;$('status').textContent=state.started?(state.winner!==null?'انتهت اللعبة':'الدور عند: '+(state.players[state.turn]||'لاعب')+(state.turn===state.me?' (أنت)':'')):'بانتظار رفيجك';$('msg').textContent=state.log||'';$('turnarrow').textContent=state.started?(state.turn===state.me?'➜ دورك الحين':'➜ دور الخصم'):'⏳ انتظار';$('turnarrow').classList.toggle('mine',state.started&&state.turn===state.me&&state.winner===null);$('opcount').textContent=state.opponent?'🃏 باقي للخصم: '+(state.opponent.right+state.opponent.left+state.opponent.fire+(state.opponent.drawn?1:0)):' ';$('turnbottom').textContent=state.turn===state.me?'➜ دورك — تقدر تلعب':'⏳ دور '+(state.players[state.turn]||'الخصم');$('opcount').classList.toggle('last-card',!!state.opponent&&(state.opponent.right+state.opponent.left+state.opponent.fire+(state.opponent.drawn?1:0))===1);$('scores').textContent=state.started&&state.scores?state.players.map((n,i)=>n+': '+state.scores[i]).join('  |  '):'';if(!state.started)return;fill('lefttable',state.table.slice(0,4),'t');fill('righttable',state.table.slice(4),'t',4);$('found').replaceChildren(...state.found.map((c,i)=>{let el=card(c,'f'+i,true);el.dataset.found='f'+i;return el}));$('right').replaceChildren(card(state.right,'right'));let deck=card(null,'deck');if(state.leftCount){deck.classList.remove('empty');deck.classList.add('back');deck.innerHTML='';deck.onclick=()=>action('draw')}else{deck.onclick=()=>action('draw')}let deckbox=document.createElement('div');deckbox.append(deck);if(state.drawn){let up=card(state.drawn,'drawn');up.classList.add('card-enter');up.style.marginTop='6px';deckbox.append(up)}$('draw').replaceChildren(deckbox);$('fire').replaceChildren(card(state.fire,'fire'));$('fire').dataset.target='fire';$('opfire').replaceChildren(card(state.opponent?.fireTop||null,'opfire'));$('opfirelabel').textContent='نار '+(state.opponent?.name||'الخصم');$('opfc').textContent=(state.opponent?.fire||0)+' ورقة';$('rc').textContent=state.rightCount+' ورقة';$('lc').textContent=state.leftCount+' ورقة';$('fc').textContent=state.fireCount+' ورقة';$('win').textContent=state.winner===null?'':state.winner===state.me?'🏆 فزت!':'فاز رفيجك';if(state.winner!==null&&!$('restart')){let b=document.createElement('button');b.id='restart';b.textContent='العب مرة ثانية';b.onclick=()=>action('restart');$('win').append(b)}}function clearSession(){sessionVersion++;localStorage.removeItem('cd_code');localStorage.removeItem('cd_token');code=null;token=null;state=null;selected=null;if(drag?.clone)drag.clone.remove();drag=null;document.body.classList.remove('drag-active');$('game').style.display='none';$('lobby').style.display='block';$('code').value='';history.replaceState(null,'',location.pathname)}function leaveRoom(){if(!confirm('تبي تغادر الغرفة وترجع للقائمة الرئيسية؟'))return;clearSession();$('welcome').textContent='رجعت للقائمة الرئيسية. اختر تجربة بروحك أو غرفة جديدة'}function newTest(){if(!confirm('تبي تبدأ تجربة جديدة؟'))return;clearSession();$('welcome').textContent='جاري إنشاء تجربة جديدة...';testMode()}async function testMode(){const v=++sessionVersion;try{let j=await req('test',{name:$('name').value.trim()||'لاعب'});if(v!==sessionVersion)return;code=j.code;token=j.token;localStorage.setItem('cd_code',code);localStorage.setItem('cd_token',token);selected=null;await refresh()}catch(e){alert(e.message)}}async function join(isJoin){const v=++sessionVersion;try{let name=$('name').value.trim()||'لاعب';let j=await req(isJoin?'join':'create',{name,code:$('code').value.trim()});if(v!==sessionVersion)return;code=j.code;token=j.token;localStorage.setItem('cd_code',code);localStorage.setItem('cd_token',token);$('welcome').textContent='كود الغرفة: '+code;await refresh()}catch(e){alert(e.message)}}async function refresh(){if(!code||!token)return;const v=sessionVersion,c=code,t=token;try{const next=await req('state?code='+encodeURIComponent(c)+'&token='+encodeURIComponent(t));if(v!==sessionVersion||c!==code||t!==token)return;if(state&&state.started&&next.started&&state.turn!==next.turn){sound('end');if(next.turn===next.me)notifyTurn()}if(state&&state.started&&next.log!==state.log&&next.log?.includes(' ركّب '))sound('card');state=next;render()}catch(e){if(v===sessionVersion)$('welcome').textContent=e.message}}async function action(type,from,to){if(!state||!state.started||state.turn!==state.me)return;const v=sessionVersion,c=code,t=token;try{const next=await req('action',{code:c,token:t,type,from,to});if(v!==sessionVersion)return;if(state&&state.turn!==next.turn){sound('end');if(next.turn===next.me)notifyTurn()}else if(type==='move'){sound('card');if(navigator.vibrate)navigator.vibrate(15)}state=next;selected=null;render()}catch(e){if(v===sessionVersion)$('msg').textContent=e.message}}function topCard(id){if(!state)return null;if(id==='right')return state.right;if(id==='fire')return state.fire;if(id==='drawn')return state.drawn;if(/^t[0-7]$/.test(id))return state.table[Number(id.slice(1))]?.at(-1)||null;return null}function choose(id,dest){if(!state||state.turn!==state.me||state.winner!==null)return;if(id==='deck'){action('draw');return}let picked=topCard(id);if(!selected&&picked?.n===1){let open=state.found.findIndex(x=>!x);if(open>=0){action('move',id,'f'+open);return}}if(selected==='drawn'&&id==='fire'){selected=null;action('discard');return}if(selected&&dest&&selected!==id){let s=selected;selected=null;action('move',s,id);return}if(id==='fire'&&!state.openFire){$('msg').textContent='النار تنفتح بعد أول تركيب';return}if(id[0]==='f'||!dest&&id==='drawn'&&!state.drawn)return;selected=id;render()}async function share(){let url=location.origin+'/?room='+code;try{if(navigator.share)await navigator.share({title:'King Slayer',text:'كود الغرفة: '+code,url});else{await navigator.clipboard.writeText(url+' كود: '+code);alert('تم نسخ الرابط')}}catch(e){}}let p=new URLSearchParams(location.search).get('room');if(p)$('code').value=p;refresh();setInterval(()=>{if(!drag&&!selected)refresh()},1800);let drag=null;document.addEventListener('pointerdown',e=>{let el=e.target.closest('.card');if(!el||!state||state.turn!==state.me||state.winner!==null)return;let wrap=el.closest('.stack');let id=wrap?.dataset.target||(['right','fire'].find(x=>el.parentElement?.id===x))||(el.parentElement?.parentElement?.id==='draw'&&el.querySelector('b')?'drawn':null);if(!id||id==='fire'&&!state.openFire||!el.querySelector('b'))return;drag={id,x:e.clientX,y:e.clientY,clone:null};},{passive:true});document.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.clone&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>9){let source=document.querySelector('.stack[data-target="'+drag.id+'"] .card:last-child')||(drag.id==='drawn'?document.querySelector('#draw .card:last-child'):document.querySelector('#'+drag.id+' .card'));if(!source)return;drag.clone=source.cloneNode(true);drag.clone.classList.add('dragging');document.body.append(drag.clone);document.body.classList.add('drag-active')}if(drag.clone){drag.clone.style.left=(e.clientX-36)+'px';drag.clone.style.top=(e.clientY-46)+'px';if(e.cancelable)e.preventDefault()}},{passive:false});document.addEventListener('pointercancel',()=>{if(drag?.clone)drag.clone.remove();drag=null;document.body.classList.remove('drag-active')});document.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;if(d.clone){d.clone.remove();document.body.classList.remove('drag-active');let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.stack,[data-found]');let to=target?.dataset.target||target?.dataset.found;if(d.id==='drawn'&&document.elementFromPoint(e.clientX,e.clientY)?.closest('#fire')){action('discard');return}if(!to){let nearest=null,dist=Infinity;document.querySelectorAll('.stack,[data-found]').forEach(el=>{let b=el.getBoundingClientRect(),dx=Math.max(b.left-e.clientX,0,e.clientX-b.right),dy=Math.max(b.top-e.clientY,0,e.clientY-b.bottom),d=Math.hypot(dx,dy);if(d<dist){dist=d;nearest=el}});if(dist<65)to=nearest?.dataset.target||nearest?.dataset.found}if(!to&&topCard(d.id)?.n===1){let open=state.found.findIndex(x=>!x);if(open>=0)to='f'+open}if(to&&to!==d.id)action('move',d.id,to);else{selected=null;render()}}},{passive:true});</script></body></html>
